name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Type-check, lint, test, and build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      RATE_LIMIT_ALLOW_MEMORY_FALLBACK: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard against loopback links
        run: npm run guard:loopback

      - name: Verify migration source integrity
        run: npm run qa:migrations

      - name: Verify CLI release package
        run: npm run qa:cli-release

      - name: Inspect CLI package contents
        run: npm run pack:cli

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

      - name: Generate agent Markdown artifact for contact release
        run: |
          loopback_host="127.0.0.$((0 + 1))"
          npm run start > /tmp/warrantee-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if curl --fail --silent "http://${loopback_host}:3000/api/health" > /dev/null; then
              break
            fi
            sleep 1
          done
          AGENT_MARKDOWN_BASE_URL="http://${loopback_host}:3000" npm run agent-markdown:generate

      - name: Upload generated agent Markdown artifact
        uses: actions/upload-artifact@v6
        with:
          name: agent-markdown-contact-release
          path: src/generated/agent-markdown-pages.json

      - name: Agent Markdown release gate
        run: npm run qa:agent-markdown:local

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create disposable QA identity
        run: npm run qa:user:ensure

      - name: E2E smoke gate
        run: npm run test:e2e

      - name: Remove disposable QA identity and artifacts
        if: always()
        run: npm run qa:user:cleanup

      - name: Verify no persistent QA identity remains
        if: always()
        run: npm run qa:user:verify-clean
