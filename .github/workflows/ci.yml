name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  # Both production-backed workflows use the same disposable QA identity.
  group: warrantee-production-qa-identity
  cancel-in-progress: false

jobs:
  build:
    name: Type-check, lint, test, and build
    runs-on: ubuntu-24.04

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-ZQJ4LRG4GN
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      RATE_LIMIT_ALLOW_MEMORY_FALLBACK: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Guard against loopback links
        run: npm run guard:loopback

      - name: Verify migration source integrity
        run: npm run qa:migrations

      - name: Verify architecture inventory
        run: npm run qa:architecture-map

      - name: Verify CLI release package
        run: npm run qa:cli-release

      - name: Inspect CLI package contents
        run: npm run pack:cli

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

      - name: Frontend performance budget
        run: npm run qa:frontend-budget

      - name: Verify final CSP artifact and Proxy trace
        run: npm run qa:csp-build

      - name: Agent Markdown release gate
        run: npm run qa:agent-markdown:local

      - name: Verify CSP event-handler isolation
        run: npm run qa:security-headers

      - name: Verify Google privacy without sending collector events
        run: |
          PORT=3111 node node_modules/next/dist/bin/next start > /tmp/warrantee-privacy-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          node -e 'let ready = false; for (let i = 0; i < 120; i++) { try { const r = await fetch("http://127.0.0.1:3111/en/pricing"); if (r.ok) { ready = true; break; } } catch {} await new Promise(r => setTimeout(r, 500)); } if (!ready) process.exit(1)'
          npm run qa:analytics-privacy -- http://127.0.0.1:3111 --chromium

      - name: Create disposable QA identity
        run: npm run qa:user:ensure

      - name: Require authenticated E2E configuration
        run: npm run qa:e2e-env

      - name: E2E smoke gate
        run: npm run test:e2e

      - name: Remove disposable QA identity and artifacts
        if: always()
        run: npm run qa:user:cleanup

      - name: Verify no persistent QA identity remains
        if: always()
        run: npm run qa:user:verify-clean
