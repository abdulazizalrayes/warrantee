name: CI

on:
  push:
    branches: [main, codex/signup-first-warranty-reliability]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, lint, test, and build
    runs-on: ubuntu-24.04

    env:
      # Build-time placeholders only; browser/backend proof runs in the real
      # disposable stack below, never against a repository Supabase secret.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder-not-a-credential
      NEXT_PUBLIC_GTM_ID: GTM-WFLBH83M
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-ZQJ4LRG4GN
      NEXT_TELEMETRY_DISABLED: '1'
      WARRANTEE_DISABLE_SENTRY_NEXT_CONFIG: '1'
      RATE_LIMIT_ALLOW_MEMORY_FALLBACK: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Guard against loopback links
        run: npm run guard:loopback

      - name: Verify migration source integrity
        run: npm run qa:migrations

      - name: Verify architecture inventory
        run: npm run qa:architecture-map

      - name: Verify CLI release package
        run: npm run qa:cli-release

      - name: Inspect CLI package contents
        run: npm run pack:cli

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

      - name: Frontend performance budget
        run: npm run qa:frontend-budget

      - name: Verify final CSP artifact and Proxy trace
        run: npm run qa:csp-build

      - name: Verify CSP event-handler isolation
        run: npm run qa:security-headers

      - name: Verify Google privacy without sending collector events
        run: |
          PORT=3111 node node_modules/next/dist/bin/next start > /tmp/warrantee-privacy-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          node -e 'let ready = false; for (let i = 0; i < 120; i++) { try { const r = await fetch("http://127.0.0.1:3111/en/pricing"); if (r.ok) { ready = true; break; } } catch {} await new Promise(r => setTimeout(r, 500)); } if (!ready) process.exit(1)'
          npm run qa:analytics-privacy -- http://127.0.0.1:3111 --chromium

  isolated-regression:
    name: Full required legacy regression on real local Auth and Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WARRANTEE_ISOLATED_E2E: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify isolated source guards
        run: |
          node scripts/run-isolated-signup-journey.mjs --check
          node tests/isolated/legacy-bootstrap.mjs --check
          node --test tests/isolated/contracts.test.mjs
      - name: Run every required legacy contract on the canonical local schema
        run: |
          node scripts/run-isolated-signup-journey.mjs --run -- \
            env E2E_SUITE=isolated-regression ISOLATED_MIN_CASES=246 bash -e -c '
              export AGENT_MARKDOWN_BASE_URL=http://127.0.0.1:3100
              export AGENT_READINESS_BASE_URL=http://127.0.0.1:3100
              npm run agent-markdown:check
              npm run qa:agent-markdown
              npm run qa:agent-readiness
              exec node node_modules/@playwright/test/cli.js test --config=playwright.config.ts
            '
      # The runner supplies canonical legacy schema and fresh local-only
      # credentials. Runtime egress guards, marker checks, zero skips/retries,
      # sanitized counters and disposable cleanup are owned by that runner.
      # These are the same three checks as qa:agent-markdown:local, reusing the
      # already-ready server instead of polling health with a placeholder key.
      # Signup-to-first-warranty persistence is required separately by
      # signup-journey.yml; populated listing mocks do not prove authorization.
      # operational-workflows.spec.ts was already a separate destructive opt-in;
      # OCR/scanner/payment/cron/provider proof is not claimed by this lane.

  synthetic-ui:
    name: Synthetic browser recovery (no backend proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_SUITE: synthetic-ui
      ISOLATED_MIN_CASES: '12'
      WARRANTEE_SYNTHETIC_UI_E2E: '1'
      WARRANTEE_ISOLATED_E2E: '1'
      E2E_BASE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder-not-a-credential
      NEXT_TELEMETRY_DISABLED: '1'
      WARRANTEE_DISABLE_SENTRY_NEXT_CONFIG: '1'
      RATE_LIMIT_ALLOW_MEMORY_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run explicitly synthetic browser recovery and geometry
        run: npx --no-install playwright test --config=playwright.config.ts
