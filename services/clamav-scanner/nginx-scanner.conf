limit_req_zone $server_name zone=warrantee_clamav_public:1m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name scanner.warrantee.io;

    client_max_body_size 64k;

    location = /healthz {
        limit_req zone=warrantee_clamav_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /v1/scan {
        limit_except POST { deny all; }
        limit_req zone=warrantee_clamav_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        proxy_send_timeout 10s;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/warrantee-clamav.access.log;
    error_log /var/log/nginx/warrantee-clamav.error.log warn;
}
