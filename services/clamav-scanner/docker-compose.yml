services:
  clamav:
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [clamd]

  scanner:
    build: .
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      MAX_FILE_BYTES: "10485760"
      ALLOWED_DOCUMENT_ORIGIN: ${ALLOWED_DOCUMENT_ORIGIN:?required}
      SCANNER_TOKEN: ${SCANNER_TOKEN:?required}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [default, clamd]

networks:
  clamd:
    internal: true

volumes:
  clamav-signatures:
