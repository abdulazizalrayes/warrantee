project_id = "warrantee-signup-isolated"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/auth/callback", "http://127.0.0.1:3100/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"

[auth.rate_limit]
# Disposable synthetic suites share one loopback IP; production/app limits stay unchanged.
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.external.google]
enabled = false
client_id = ""
secret = ""

[analytics]
enabled = false

[edge_runtime]
enabled = false
